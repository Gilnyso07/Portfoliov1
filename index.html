   <section class="gallery">
    <script>
      const gallery = document.querySelector('.gallery');
      const imageCount = 17;
      const folder = 'Masonry gallery v1';

      const overlayTexts = [
        "B2B App Onboarding Screens", // text for image 1
        "StudentAlpha Social Media", // text for image 2
        "", // text for image 3
        "Illustrations", // text for image 4
        "Nationaal Archief VR Experience", // text for image 5
        "Tool for Low Health Literacy", // no text for image 6
        "", // text for image 7
        "InteractionLab Branding", // text for image 8
        "DocuWiki UI/UX", // text for image 9
        "", // no text for image 10
        "PickWise UI/UX", // text for image 11
        "Motion Graphics Showreel", // text for image 12
        "Mascot Design", // text for image 13
        "MusicAll UI/UX", // no text for image 14
        "", // text for image 15
        "Twente Canal Workshop", // text for image 16
        "GreenHub Twente Animation" // text for image 17
      ];

      for (let i = 1; i <= imageCount; i++) {
        const link = document.createElement('a');
        link.href = `${folder}/image${i}.png`;
        if ([3, 7, 10, 15].includes(i)) {
            link.className = 'gallery-item no-hover';
          } else {
            link.className = 'gallery-item';
}

        const img = document.createElement('img');
        img.src = `${folder}/image${i}.png`;
        img.alt = `Gallery image ${i}`;
        link.appendChild(img);

        const text = overlayTexts[i - 1];
        if (text) {
          const overlayText = document.createElement('span');
          overlayText.className = 'overlay-text';
          overlayText.textContent = text;
          link.appendChild(overlayText);
        }

        gallery.appendChild(link);
      }
    </script>
  </section>

    <!-- ===== Modal Overlay ===== -->
  <div id="projectModal" class="modal">
    <div class="modal-content">
      <button class="modal-close">&times;</button>
      <div id="pdf-loader" class="loader"></div>
      <iframe id="projectFrame" src="" frameborder="0"></iframe>
    </div>
  </div>

  <!-- ===== JS Modal Overlay ===== -->
  <script>
    // Select modal and key elements
    const modal = document.getElementById('projectModal');
    const iframe = document.getElementById('projectFrame');
    const closeBtn = document.querySelector('.modal-close');

    function getScrollbarWidth(){
      return window.innerWidth - document.documentElement.clientWidth;
    }

    // Direct mapping of each image to its PDF (empty string for no project)
    const projectLinks = [
      "TBD.pdf",                             // image 1
      "PDFs/StudentAlpha.pdf",               // image 2
      "",                                    // image 3
      "PDFs/Illustrations.pdf",              // image 4
      "TBD.pdf",                             // image 5
      "PDFs/Thesis.pdf",                     // image 6
      "",                                    // image 7
      "PDFs/InteractionLabPortfolio.pdf",    // image 8
      "PDFs/DocuWiki.pdf",                   // image 9
      "",                                    // image 10
      "PDFs/PickWise.pdf",                   // image 11
      "PDFs/Showreel.pdf",                   // image 12
      "TBD.pdf",                             // image 13
      "PDFs/MusicAll.pdf",                   // image 14
      "",                                    // image 15
      "TBD.pdf",                             // image 16
      "TBD.pdf"                              // image 17
    ];

    // Close modal when clicking the close button
    closeBtn.addEventListener('click', () => {
      modal.style.display = 'none';
      iframe.src = "";
      document.body.classList.remove('modal-open'); // add this
    });
    
    // Close modal when clicking outside content
    modal.addEventListener('click', (event) => {
      if (event.target === modal) {
        modal.style.display = 'none';
        iframe.src = "";
        document.body.classList.remove('modal-open'); // add this
      }
    });

    document.querySelectorAll('.gallery-item').forEach((item, index) => {
      item.addEventListener('click', (event) => {
        event.preventDefault();
        const link = projectLinks[index];
        if (link) {
          iframe.src = link;
          document.getElementById("pdf-loader").style.display = "block";
          modal.style.display = 'flex';
          document.body.classList.add('modal-open'); // add this
        }
      });
    });

    iframe.addEventListener("load", () => {
      setTimeout(() => {
        document.getElementById("pdf-loader").style.display = "none";
      }, 600); // delay in milliseconds
    });
  </script>
